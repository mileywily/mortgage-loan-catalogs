name: Integración Continua Go (CI)

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Descargar el código
      uses: actions/checkout@v4

    - name: Configurar Go
      uses: actions/setup-go@v5
      with:
        go-version: "stable" # Usar la última versión estable para evitar conflictos con Temporal SDK

    - name: Instalar Dependencias
      run: go mod download

    - name: Ejecutar Pruebas Unitarias e Integración
      run: go test -v ./...

    - name: Verificar Compilación del Binario
      run: go build -v ./cmd/server/main.go

    - name: Validar Build de la Imagen Docker
      run: docker build -t mortgage-catalogs-go:test .

